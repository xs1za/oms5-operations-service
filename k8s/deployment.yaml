apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms5
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms5
  template:
    metadata:
      labels:
        app: oms5
    spec:
      initContainers:
        - name: wait-postgres
          image: oms5:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              import socket
              import time

              for attempt in range(60):
                  try:
                      with socket.create_connection(("oms5-postgres", 5432), timeout=2):
                          raise SystemExit(0)
                  except OSError:
                      time.sleep(2)
              raise SystemExit(1)
              PY
      containers:
        - name: oms5
          image: oms5:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oms5-config
            - secretRef:
                name: oms5-secret
                optional: false
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
